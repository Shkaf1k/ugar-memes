                    { id: 'c_102', authorId: 'user_denis', text: '@Алина_Вайб классика, зато все мемы в сохраненках пересмотрены!', createdAt: '12 МИН. НАЗАД' }

                id: 'post_2',
                authorId: 'user_denis',
                title: 'Тимлид: «Там правка на 5 минут, зальёшь в прод до обеда?» Я в 18:45:',
                tag: '#локальный_мем',
                mediaUrl: 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExN2J4eG16c3h6Z3B6Z3B6Z3B6Z3B6Z3B6Z3B6Z3B6Z3B6Z3B6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/QMHoU66sBXqqLqYvGO/giphy.gif',

                ]

        ];

        function BrutalPaperBackground() {
            return (
                <div className="fixed inset-0 -z-10 bg-[#F4F1EA]" style={{
                    backgroundImage: 'radial-gradient(#000000 1.25px, transparent 1.25px)',
                    backgroundSize: '20px 20px'
                }}>
                    <div className="absolute inset-0 bg-[#F4F1EA]/75" />
                </div>
            );
        }

        function AcidMarqueeTicker() {
            return (
                <div className="overflow-hidden border-b-2 border-black bg-[#CCFF00] py-1.5 text-black select-none">
                    <motion.div animate={{ x: ['0%', '-50%'] }} transition={{ duration: 22, repeat: Infinity, ease: 'linear' }} className="flex w-max items-center gap-8 font-mono text-xs font-black tracking-wider uppercase">
                        {[...TICKER_ITEMS, ...TICKER_ITEMS].map((item, index) => (
                            <span key={index} className="flex items-center gap-8">
                                <span>{item}</span>
                                <span className="inline-block h-2 w-2 rotate-45 bg-black" />
                            </span>
                        ))}
                    </motion.div>
                </div>
            );
        }

        function BrutalHeader({ currentUser, searchQuery, setSearchQuery, selectedTag, setSelectedTag, onOpenCreateModal, onOpenProfile, onGoHome, activeView }) {
            return (
                <header className="sticky top-0 z-40 border-b-2 border-black bg-white">
                    <div className="mx-auto max-w-4xl px-3 py-3 sm:px-6">
                        <div className="flex flex-wrap items-center justify-between gap-3">
                            <button onClick={onGoHome} className="group flex items-center gap-3 text-left focus:outline-none">
                                <div className="flex h-11 w-11 -rotate-3 items-center justify-center border-2 border-black bg-[#FF2A85] text-white shadow-[3px_3px_0px_0px_#000]">
                                    <Zap className="h-6 w-6 fill-[#CCFF00] text-black" />
                                </div>
                                <div>
                                    <span className="border-2 border-black bg-[#CCFF00] px-2 py-0.5 text-lg font-black tracking-tight text-black uppercase shadow-[2px_2px_0px_0px_#000] sm:text-xl">УГАР.IO</span>
                                    <span className="mt-0.5 block font-mono text-[10px] font-bold tracking-widest text-black/70 uppercase">ACID MEME ZINE</span>
                                </div>
                            </button>

                            <div className="order-3 w-full md:order-2 md:max-w-xs lg:max-w-sm">
                                <div className="relative flex items-center">
                                    <Search className="pointer-events-none absolute left-3 h-4 w-4 text-black" />
                                    <input type="text" value={searchQuery} onChange={(e) => { setSearchQuery(e.target.value); if (activeView !== 'feed') onGoHome(); }} placeholder="НАЙТИ МЕМ ИЛИ КЕНТА..." className="w-full border-2 border-black bg-[#F4F1EA] py-2 pr-8 pl-9 font-mono text-xs font-bold text-black placeholder-black/45 shadow-[3px_3px_0px_0px_#000] focus:outline-none" />
                                    {searchQuery && <button onClick={() => setSearchQuery('')} className="absolute right-2 border border-black bg-white p-0.5"><X className="h-3.5 w-3.5" /></button>}
                                </div>
                            </div>

                            <div className="order-2 flex items-center gap-2.5 md:order-3">
                                <button onClick={onOpenCreateModal} className="flex items-center gap-1.5 border-2 border-black bg-[#CCFF00] px-3.5 py-2 text-xs font-black text-black uppercase shadow-[4px_4px_0px_0px_#000] hover:bg-[#FFB800]">
                                    <Plus className="h-4 w-4 stroke-[3]" /> <span>КИНУТЬ МЕМ</span>
                                </button>
                                <button onClick={() => onOpenProfile(currentUser.id)} className="flex items-center gap-2 border-2 border-black bg-white p-1 pr-2.5 shadow-[4px_4px_0px_0px_#000]">
                                    <img src={currentUser.avatar} alt={currentUser.nickname} className="h-8 w-8 border-2 border-black object-cover" />
                                    <span className="hidden max-w-[110px] truncate font-mono text-xs font-black uppercase sm:inline">{currentUser.nickname}</span>
                                </button>
                            </div>
                        </div>

                        {activeView === 'feed' && (
                            <div className="mt-3 flex items-center gap-2 overflow-x-auto pt-1 pb-1 no-scrollbar">
                                {TAGS.map((tag) => (
                                    <button key={tag} onClick={() => setSelectedTag(tag)} className={`shrink-0 border-2 border-black px-3 py-1 font-mono text-xs font-black uppercase ${selectedTag === tag ? 'bg-[#FF2A85] text-white shadow-[3px_3px_0px_0px_#000]' : 'bg-[#F4F1EA] text-black shadow-[2px_2px_0px_0px_#000]'}`}>
                                        {tag}
                                    </button>
                                ))}
                            </div>
                        )}
                    </div>
                    <AcidMarqueeTicker />

            );

        function CreateMemeModal({ isOpen, onClose, onPublish }) {
            const [title, setTitle] = useState('');
            const [tag, setTag] = useState('#жиза');
            const [mediaUrl, setMediaUrl] = useState('');
            const [error, setError] = useState('');
            const fileInputRef = useRef(null);

            if (!isOpen) return null;

            const handleFileUpload = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => { setMediaUrl(reader.result); setError(''); };
                reader.readAsDataURL(file);
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div onClick={onClose} className="fixed inset-0 bg-black/75" />
                    <div className="relative z-10 max-h-[90vh] w-full max-w-lg overflow-y-auto border-4 border-black bg-white p-5 shadow-[8px_8px_0px_0px_#000]">
                        <div className="flex items-center justify-between border-b-2 border-black pb-3.5">
                            <h2 className="text-xl font-black uppercase">ЗАКИНУТЬ НОВЫЙ МЕМ</h2>
                            <button onClick={onClose} className="border-2 border-black bg-[#FF2A85] p-1.5 text-white"><X className="h-5 w-5" /></button>
                        </div>
                        <form onSubmit={(e) => { e.preventDefault(); if(!title || !mediaUrl) { setError('Заполни текст и картинку!'); return; } onPublish({ title, tag, mediaUrl }); setTitle(''); setMediaUrl(''); onClose(); }} className="mt-4 space-y-4">
                            <div>
                                <label className="block font-mono text-xs font-black uppercase mb-1">Подпись</label>
                                <textarea rows={2} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Когда зашёл в свой код..." className="w-full border-2 border-black bg-[#F4F1EA] p-3 text-sm font-bold shadow-[3px_3px_0px_0px_#000] focus:outline-none" />
                            </div>
                            <div>
                                <label className="block font-mono text-xs font-black uppercase mb-1">Категория</label>
                                <div className="flex flex-wrap gap-2">
                                    {TAGS.filter(t => t !== '#все').map(t => (
                                        <button type="button" key={t} onClick={() => setTag(t)} className={`border-2 border-black px-3 py-1.5 font-mono text-xs font-black uppercase ${tag === t ? `${TAG_COLORS[t]} shadow-[3px_3px_0px_0px_#000]` : 'bg-[#F4F1EA]'}`}>{t}</button>
                                    ))}
                                </div>
                            </div>
                            <div>
                                <div onClick={() => fileInputRef.current?.click()} className="flex cursor-pointer flex-col items-center justify-center border-2 border-dashed border-black bg-[#F4F1EA] p-6 text-center">
                                    <ImageIcon className="mb-2 h-8 w-8" />
                                    <span className="text-sm font-black uppercase">Загрузить файл или GIF</span>
                                    <input ref={fileInputRef} type="file" accept="image/*" onChange={handleFileUpload} className="hidden" />
                                </div>
                            </div>
                            {mediaUrl && <img src={mediaUrl} alt="Preview" className="max-h-48 w-full object-contain border-2 border-black bg-black" />}
                            {error && <div className="bg-[#FF2A85] text-white p-2 font-mono text-xs font-bold">{error}</div>}
                            <div className="flex justify-end gap-3 pt-2">
                                <button type="button" onClick={onClose} className="border-2 border-black bg-white px-4 py-2 font-mono text-xs font-black uppercase shadow-[3px_3px_0px_0px_#000]">Отмена</button>
                                <button type="submit" className="border-2 border-black bg-[#CCFF00] px-5 py-2 font-mono text-xs font-black uppercase shadow-[4px_4px_0px_0px_#000]">Опубликовать</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function MemeCard({ post, author, users, onOpenProfile, onVote, onToggleEmoji, onAddComment }) {
            const [showComments, setShowComments] = useState(false);
            const [commentText, setCommentText] = useState('');

            return (
                <article className="border-2 border-black bg-white shadow-[6px_6px_0px_0px_#000] mb-6">
                    <div className="flex items-center justify-between border-b-2 border-black bg-[#F4F1EA] px-4 py-3">
                        <button onClick={() => onOpenProfile(author.id)} className="flex items-center gap-3 text-left">
                            <img src={author.avatar} alt={author.nickname} className="h-11 w-11 border-2 border-black object-cover" />
                            <div>
                                <span className="block font-black uppercase">{author.nickname}</span>
                                <span className="font-mono text-[11px] font-bold text-black/60">{post.createdAt}</span>
                            </div>
                        </button>
                        <span className={`border-2 border-black px-2.5 py-1 font-mono text-xs font-black uppercase shadow-[2px_2px_0px_0px_#000] ${TAG_COLORS[post.tag]}`}>{post.tag}</span>
                    </div>

                    <div className="p-4 sm:p-5">
                        <p className="text-base font-black mb-3">{post.title}</p>
                        <div className="flex items-center justify-center overflow-hidden border-2 border-black bg-black">
                            <img src={post.mediaUrl} alt={post.title} className="max-h-[500px] w-full object-contain" />
                        </div>
                    </div>

                    <div className="flex flex-wrap items-center justify-between gap-2.5 px-4 pb-4">
                        <div className="flex items-center gap-2">
                            <button onClick={() => onVote(post.id, 'like')} className={`flex items-center gap-1.5 border-2 border-black px-3 py-1.5 font-mono text-xs font-black shadow-[3px_3px_0px_0px_#000] ${post.userVote === 'like' ? 'bg-[#FFB800]' : 'bg-white'}`}>
                                <Flame className="h-4 w-4" /> <span>{post.likes}</span>
                            </button>
                            <button onClick={() => setShowComments(!showComments)} className="flex items-center gap-1.5 border-2 border-black px-3 py-1.5 font-mono text-xs font-black bg-white shadow-[3px_3px_0px_0px_#000]">
                                <MessageCircle className="h-4 w-4" /> <span>{post.comments.length}</span>
                            </button>
                        </div>
                        <div className="flex gap-1.5">
                            {QUICK_EMOJIS.map(emoji => (
                                <button key={emoji} onClick={() => onToggleEmoji(post.id, emoji)} className="border-2 border-black px-2 py-1 bg-[#F4F1EA] shadow-[2px_2px_0px_0px_#000] font-mono text-xs">
                                    {emoji} {post.emojis?.[emoji] || ''}
                                </button>
                            ))}
                        </div>
                    </div>

                    {showComments && (
                        <div className="border-t-2 border-black bg-[#F4F1EA] p-4 space-y-3">
                            {post.comments.map(c => {
                                const cAuthor = users[c.authorId] || { nickname: 'Аноним', avatar: AVATAR_PRESETS[0] };
                                return (
                                    <div key={c.id} className="flex gap-2.5 border-2 border-black bg-white p-2.5 shadow-[2px_2px_0px_0px_#000]">
                                        <img src={cAuthor.avatar} className="h-7 w-7 border-2 border-black object-cover" />
                                        <div>
                                            <span className="font-black text-xs uppercase">{cAuthor.nickname}</span>
                                            <p className="text-xs font-bold">{c.text}</p>
                                        </div>
                                    </div>
                                );
                            })}
                            <form onSubmit={(e) => { e.preventDefault(); if(!commentText) return; onAddComment(post.id, commentText); setCommentText(''); }} className="flex gap-2">
                                <input type="text" value={commentText} onChange={(e) => setCommentText(e.target.value)} placeholder="Написать коммент..." className="flex-1 border-2 border-black bg-white px-3 py-1.5 font-mono text-xs shadow-[2px_2px_0px_0px_#000] focus:outline-none" />
                                <button type="submit" className="border-2 border-black bg-[#CCFF00] px-3 py-1.5 font-mono text-xs font-black shadow-[2px_2px_0px_0px_#000]">ОК</button>
                            </form>
                        </div>
                    )}
                </article>
            );
        }

        function App() {
            const [users, setUsers] = useState(() => JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS)) || INITIAL_USERS);
            const [posts, setPosts] = useState(() => JSON.parse(localStorage.getItem(STORAGE_KEYS.POSTS)) || INITIAL_POSTS);
            const [currentUserId] = useState('user_me');
            const [activeView, setActiveView] = useState('feed');
            const [profileTargetId, setProfileTargetId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedTag, setSelectedTag] = useState('#все');
            const [isCreateModalOpen, setIsCreateModalOpen] = useState(false);

            useEffect(() => localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users)), [users]);
            useEffect(() => localStorage.setItem(STORAGE_KEYS.POSTS, JSON.stringify(posts)), [posts]);

            const currentUser = users[currentUserId];

            const filteredPosts = useMemo(() => {
                return posts.filter(post => {
                    const author = users[post.authorId];
                    const matchesSearch = !searchQuery || post.title.toLowerCase().includes(searchQuery.toLowerCase()) || author?.nickname.toLowerCase().includes(searchQuery.toLowerCase());
                    const matchesTag = selectedTag === '#все' || post.tag === selectedTag;
                    return matchesSearch && matchesTag;
                });
            }, [posts, users, searchQuery, selectedTag]);

            return (
                <div className="min-h-screen pb-12">
                    <BrutalPaperBackground />
                    <BrutalHeader currentUser={currentUser} searchQuery={searchQuery} setSearchQuery={setSearchQuery} selectedTag={selectedTag} setSelectedTag={setSelectedTag} onOpenCreateModal={() => setIsCreateModalOpen(true)} onOpenProfile={(id) => { setProfileTargetId(id); setActiveView('profile'); }} onGoHome={() => setActiveView('feed')} activeView={activeView} />

                    <main className="mx-auto max-w-xl px-3 py-6">
                        {activeView === 'feed' ? (
                            filtered.postsLength === 0 && filteredPosts.length === 0 ? <div className="p-6 bg-white border-2 border-black text-center font-mono font-bold">Ничего не найдено</div> :
                            filteredPosts.map(post => <MemeCard key={post.id} post={post} author={users[post.authorId] || currentUser} users={users} onOpenProfile={(id) => { setProfileTargetId(id); setActiveView('profile'); }} onVote={(id, type) => {
                                setPosts(posts.map(p => p.id === id ? { ...p, likes: p.userVote === type ? p.likes - 1 : p.likes + 1, userVote: p.userVote === type ? null : type } : p));
                            }} onToggleEmoji={(id, emoji) => {
                                setPosts(posts.map(p => p.id === id ? { ...p, emojis: { ...p.emojis, [emoji]: (p.emojis?.[emoji] || 0) + 1 } } : p));
                            }} onAddComment={(id, text) => {
                                setPosts(posts.map(p => p.id === id ? { ...p, comments: [...p.comments, { id: 'c_' + Date.now(), authorId: currentUserId, text, createdAt: 'Только что' }] } : p));
                            }} />)
                        ) : (
                            <div className="bg-white border-4 border-black p-6 shadow-[8px_8px_0px_0px_#000]">
                                <button onClick={() => setActiveView('feed')} className="mb-4 flex items-center gap-2 border-2 border-black bg-[#CCFF00] px-3 py-1.5 font-mono text-xs font-black uppercase shadow-[3px_3px_0px_0px_#000]"><ArrowLeft className="h-4 w-4" /> Назад</button>
                                <div className="h-32 border-2 border-black mb-4" style={{ background: users[profileTargetId]?.banner || currentUser.banner }} />
                                <img src={users[profileTargetId]?.avatar || currentUser.avatar} className="h-20 w-20 border-4 border-black object-cover -mt-14 mb-3 bg-white shadow-[3px_3px_0px_0px_#000]" />
                                <h1 className="text-2xl font-black uppercase">{users[profileTargetId]?.nickname || currentUser.nickname}</h1>
                                <p className="font-mono text-xs font-bold text-black/70 mt-1">{users[profileTargetId]?.status || currentUser.status}</p>
                            </div>
                        )}
                    </main>

                    <CreateMemeModal isOpen={isCreateModalOpen} onClose={() => setIsCreateModalOpen(false)} onPublish={(newPost) => {
                        setPosts([{ id: 'p_' + Date.now(), authorId: currentUserId, ...newPost, createdAt: 'Только что', likes: 1, dislikes: 0, comments: [] }, ...posts]);
                    }} />
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
