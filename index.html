<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>УГАР.IO — Acid Meme Zine</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Inter:wght@700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#F4F1EA] text-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ==========================================
        // НАСТРОЙКА FIREBASE (Вставь свои ключи из консоли Firebase)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyYOUR_API_KEY_HERE",
            authDomain: "your-app.firebaseapp.com",
            projectId: "your-app-id",
            storageBucket: "your-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123:web:abc"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        const TAGS = ['#все', '#жиза', '#кринж', '#локальный_мем', '#видео'];
        const TAG_COLORS = {
            '#жиза': 'bg-[#CCFF00] text-black',
            '#кринж': 'bg-[#FF2A85] text-white',
            '#локальный_мем': 'bg-[#3B82F6] text-white',
            '#видео': 'bg-[#FFB800] text-black'
        };
        const QUICK_EMOJIS = ['😂', '💀', '🔥', '🤡'];
        const AVATAR_PRESETS = [
            'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=250&q=80',
            'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=250&q=80',
            'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=250&q=80'
        ];

        // Экран Авторизации / Регистрации
        function AuthScreen({ onLoginSuccess }) {
            const [isRegister, setIsRegister] = useState(false);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [nickname, setNickname] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);

                try {
                    if (isRegister) {
                        if (!nickname.trim()) {
                            throw new Error('Введи никнейм!');
                        }
                        const res = await auth.createUserWithEmailAndPassword(email, password);
                        // Сохраняем ник в Firestore
                        await db.collection('users').doc(res.user.uid).set({
                            id: res.user.uid,
                            nickname: nickname.trim(),
                            status: 'Новый участник тусовки ⚡',
                            avatar: AVATAR_PRESETS[0],
                            banner: 'linear-gradient(135deg, #CCFF00 0%, #FFB800 100%)',
                            joinedDate: '2026'
                        });
                    } else {
                        await auth.signInWithEmailAndPassword(email, password);
                    }
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="max-w-md w-full border-4 border-black bg-white p-6 shadow-[8px_8px_0px_0px_#000]">
                        <div className="flex items-center gap-3 mb-6 pb-4 border-b-2 border-black">
                            <div className="flex h-10 w-10 items-center justify-center border-2 border-black bg-[#FF2A85] text-white shadow-[3px_3px_0px_0px_#000]">
                                ⚡
                            </div>
                            <h1 className="text-2xl font-black uppercase">УГАР.IO // {isRegister ? 'Регистрация' : 'Вход'}</h1>
                        </div>

                        {error && (
                            <div className="mb-4 border-2 border-black bg-[#FF2A85] p-3 text-xs font-black text-white shadow-[3px_3px_0px_0px_#000]">
                                ⚠️ {error}
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-4">
                            {isRegister && (
                                <div>
                                    <label className="block font-mono text-xs font-black uppercase mb-1">Никнейм</label>
                                    <input 
                                        type="text" 
                                        value={nickname} 
                                        onChange={e => setNickname(e.target.value)} 
                                        placeholder="КиберКот_2077"
                                        className="w-full border-2 border-black bg-[#F4F1EA] p-2.5 text-sm font-bold shadow-[3px_3px_0px_0px_#000] focus:outline-none"
                                        required 
                                    />
                                </div>
                            )}
                            <div>
                                <label className="block font-mono text-xs font-black uppercase mb-1">Email</label>
                                <input 
                                    type="email5" 
                                    value={email} 
                                    onChange={e => setEmail(e.target.value)} 
                                    placeholder="mail@example.com"
                                    className="w-full border-2 border-black bg-[#F4F1EA] p-2.5 text-sm font-bold shadow-[3px_3px_0px_0px_#000] focus:outline-none"
                                    required 
                                />
                            </div>
                            <div>
                                <label className="block font-mono text-xs font-black uppercase mb-1">Пароль</label>
                                <input 
                                    type="password" 
                                    value={password} 
                                    onChange={e => setPassword(e.target.value)} 
                                    placeholder="••••••••"
                                    className="w-full border-2 border-black bg-[#F4F1EA] p-2.5 text-sm font-bold shadow-[3px_3px_0px_0px_#000] focus:outline-none"
                                    required 
                                />
                            </div>

                            <button 
                                type="submit" 
                                disabled={loading}
                                className="w-full border-2 border-black bg-[#CCFF00] py-3 font-mono text-sm font-black uppercase shadow-[4px_4px_0px_0px_#000] hover:bg-[#FFB800] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all"
                            >
                                {loading ? 'Загрузка...' : (isRegister ? 'Зарегистрироваться' : 'Войти в тусовку')}
                            </button>
                        </form>

                        <div className="mt-6 text-center">
                            <button 
                                onClick={() => setIsRegister(!isRegister)} 
                                className="font-mono text-xs font-bold underline uppercase hover:text-[#FF2A85]"
                            >
                                {isRegister ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [firebaseUser, setFirebaseUser] = useState(null);
            const [currentUserProfile, setCurrentUserProfile] = useState(null);
            const [posts, setPosts] = useState([]);
            const [usersMap, setUsersMap] = useState({});
            
            const [activeView, setActiveView] = useState('feed');
            const [profileTargetId, setProfileTargetId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedTag, setSelectedTag] = useState('#все');
            const [isCreateModalOpen, setIsCreateModalOpen] = useState(false);

            // Поля создания поста
            const [newTitle, setNewTitle] = useState('');
            const [newTag, setNewTag] = useState('#жиза');
            const [newMedia, setNewMedia] = useState('');

            // Следим за статусом авторизации Firebase
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (user) => {
                    setFirebaseUser(user);
                    if (user) {
                        // Загружаем профиль из Firestore
                        const docRef = db.collection('users').doc(user.uid);
                        const doc = await docRef.get();
                        if (doc.exists) {
                            setCurrentUserProfile(doc.data());
                        } else {
                            // Если профиля нет, создаем базовый
                            const basicProfile = {
                                id: user.uid,
                                nickname: user.email.split('@')[0],
                                status: 'Мемодел 🚀',
                                avatar: AVATAR_PRESETS[0],
                                banner: 'linear-gradient(135deg, #CCFF00 0%, #FFB800 100%)',
                                joinedDate: '2026'
                            };
                            await docRef.set(basicProfile);
                            setCurrentUserProfile(basicProfile);
                        }
                    } else {
                        setCurrentUserProfile(null);
                    }
                });
                return () => unsubscribe();
            }, []);

            // Загружаем посты из Firestore в реальном времени
            useEffect(() => {
                const unsubscribe = db.collection('posts').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                    const loadedPosts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setPosts(loadedPosts);
                });
                // Загружаем всех пользователей для отображения аватарок в постах
                const unsubUsers = db.collection('users').onSnapshot(snapshot => {
                    const map = {};
                    snapshot.docs.forEach(doc => {
                        map[doc.id] = doc.data();
                    });
                    setUsersMap(map);
                });
                return () => { unsubscribe(); unsubUsers(); };
            }, []);

            if (!firebaseUser || !currentUserProfile) {
                return (
                    <div className="min-h-screen">
                        <div className="fixed inset-0 -z-10 bg-[#F4F1EA]" style={{ backgroundImage: 'radial-gradient(#000000 1.25px, transparent 1.25px)', backgroundSize: '20px 20px' }}>
                            <div className="absolute inset-0 bg-[#F4F1EA]/75" />
                        </div>
                        <AuthScreen />
                    </div>
                );
            }

            const handlePublish = async (e) => {
                e.preventDefault();
                if (!newTitle.trim() || !newMedia.trim()) return;

                await db.collection('posts').add({
                    authorId: firebaseUser.uid,
                    title: newTitle.trim(),
                    tag: newTag,
                    mediaUrl: newMedia.trim(),
                    createdAt: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    likes: 1,
                    userVotes: { [firebaseUser.uid]: 'like' },
                    comments: []
                });

                setNewTitle('');
                setNewMedia('');
                setIsCreateModalOpen(false);
            };

            const handleVote = async (postId, currentLikes, currentVotes) => {
                const votes = currentVotes || {};
                const hasLiked = votes[firebaseUser.uid] === 'like';
                const newVotes = { ...votes };
                let newLikes = currentLikes;

                if (hasLiked) {
                    delete newVotes[firebaseUser.uid];
                    newLikes -= 1;
                } else {
                    newVotes[firebaseUser.uid] = 'like';
                    newLikes += 1;
                }

                await db.collection('posts').doc(postId).update({
                    likes: newLikes,
                    userVotes: newVotes
                });
            };

            const filteredPosts = useMemo(() => {
                return posts.filter(post => {
                    const author = usersMap[post.authorId];
                    const matchesSearch = !searchQuery || post.title.toLowerCase().includes(searchQuery.toLowerCase()) || (author && author.nickname.toLowerCase().includes(searchQuery.toLowerCase()));
                    const matchesTag = selectedTag === '#все' || post.tag === selectedTag;
                    return matchesSearch && matchesTag;
                });
            }, [posts, usersMap, searchQuery, selectedTag]);

            return (
                <div className="min-h-screen pb-12">
                    <div className="fixed inset-0 -z-10 bg-[#F4F1EA]" style={{ backgroundImage: 'radial-gradient(#000000 1.25px, transparent 1.25px)', backgroundSize: '20px 20px' }}>
                        <div className="absolute inset-0 bg-[#F4F1EA]/75" />
                    </div>

                    {/* Шапка */}
                    <header className="sticky top-0 z-40 border-b-2 border-black bg-white">
                        <div className="mx-auto max-w-4xl px-3 py-3 sm:px-6 flex flex-wrap items-center justify-between gap-3">
                            <button onClick={() => setActiveView('feed')} className="flex items-center gap-3 text-left focus:outline-none">
                                <div className="flex h-10 w-10 -rotate-3 items-center justify-center border-2 border-black bg-[#FF2A85] text-white shadow-[3px_3px_0px_0px_#000]">
                                    ⚡
                                </div>
                                <span className="border-2 border-black bg-[#CCFF00] px-2 py-0.5 text-lg font-black tracking-tight text-black uppercase shadow-[2px_2px_0px_0px_#000]">УГАР.IO</span>
                            </button>

                            <div className="flex items-center gap-2">
                                <button onClick={() => setIsCreateModalOpen(true)} className="border-2 border-black bg-[#CCFF00] px-3 py-2 text-xs font-black uppercase shadow-[4px_4px_0px_0px_#000] hover:bg-[#FFB800] transition-all">
                                    + КИНУТЬ МЕМ
                                </button>
                                <button onClick={() => { setProfileTargetId(firebaseUser.uid); setActiveView('profile'); }} className="flex items-center gap-2 border-2 border-black bg-white p-1 pr-2 shadow-[4px_4px_0px_0px_#000]">
                                    <img src={currentUserProfile.avatar} className="h-7 w-7 border border-black object-cover" />
                                    <span className="font-mono text-xs font-black uppercase">{currentUserProfile.nickname}</span>
                                </button>
                                <button onClick={() => auth.signOut()} className="border-2 border-black bg-[#FF2A85] px-2 py-1.5 text-xs font-bold text-white shadow-[2px_2px_0px_0px_#000]" title="Выйти">
                                    🚪
                                </button>
                            </div>
                        </div>

                        {activeView === 'feed' && (
                            <div className="mx-auto max-w-4xl px-3 pb-2 flex gap-2 overflow-x-auto no-scrollbar">
                                {TAGS.map(tag => (
                                    <button key={tag} onClick={() => setSelectedTag(tag)} className={`border-2 border-black px-2.5 py-0.5 font-mono text-xs font-black uppercase ${selectedTag === tag ? 'bg-[#FF2A85] text-white shadow-[2px_2px_0px_0px_#000]' : 'bg-[#F4F1EA]'}`}>
                                        {tag}
                                    </button>
                                ))}
                            </div>
                        )}
                    </header>

                    {/* Контент */}
                    <main className="mx-auto max-w-xl px-3 py-6">
                        {activeView === 'feed' ? (
                            <div className="space-y-6">
                                {filteredPosts.length === 0 ? (
                                    <div className="border-2 border-black bg-white p-8 text-center font-mono font-bold shadow-[4px_4px_0px_0px_#000]">Мемов пока нет. Стань первым! 🚀</div>
                                ) : (
                                    filteredPosts.map(post => {
                                        const author = usersMap[post.authorId] || { nickname: 'Аноним', avatar: AVATAR_PRESETS[0] };
                                        const isLiked = post.userVotes && post.userVotes[firebaseUser.uid] === 'like';
                                        return (
                                            <article key={post.id} className="border-2 border-black bg-white shadow-[6px_6px_0px_0px_#000]">
                                                <div className="flex items-center justify-between border-b-2 border-black bg-[#F4F1EA] px-4 py-3">
                                                    <button onClick={() => { setProfileTargetId(post.authorId); setActiveView('profile'); }} className="flex items-center gap-3">
                                                        <img src={author.avatar} className="h-10 w-10 border-2 border-black object-cover" />
                                                        <div className="text-left">
                                                            <span className="block font-black uppercase text-sm">{author.nickname}</span>
                                                            <span className="font-mono text-[10px] text-black/60">{post.createdAt}</span>
                                                        </div>
                                                    </button>
                                                    <span className={`border-2 border-black px-2 py-0.5 font-mono text-xs font-black uppercase ${TAG_COLORS[post.tag] || 'bg-[#CCFF00]'}`}>{post.tag}</span>
                                                </div>

                                                <div className="p-4">
                                                    <p className="font-black text-base mb-3">{post.title}</p>
                                                    <div className="border-2 border-black bg-black flex justify-center overflow-hidden">
                                                        <img src={post.mediaUrl} className="max-h-[450px] w-full object-contain" />
                                                    </div>
                                                </div>

                                                <div className="flex items-center justify-between px-4 pb-4">
                                                    <button 
                                                        onClick={() => handleVote(post.id, post.likes, post.userVotes)} 
                                                        className={`border-2 border-black px-3 py-1.5 font-mono text-xs font-black shadow-[3px_3px_0px_0px_#000] transition-all ${isLiked ? 'bg-[#FFB800]' : 'bg-white'}`}
                                                    >
                                                        🔥 Огонь ({post.likes || 0})
                                                    </button>
                                                </div>
                                            </article>
                                        );
                                    })
                                )}
                            </div>
                        ) : (
                            /* Профиль */
                            <div className="border-4 border-black bg-white p-5 shadow-[8px_8px_0px_0px_#000]">
                                <button onClick={() => setActiveView('feed')} className="mb-4 border-2 border-black bg-[#CCFF00] px-3 py-1 font-mono text-xs font-black uppercase shadow-[3px_3px_0px_0px_#000]">
                                    ← Назад к ленте
                                </button>
                                {(() => {
                                    const pUser = usersMap[profileTargetId] || currentUserProfile;
                                    return (
                                        <div>
                                            <div className="h-28 border-2 border-black mb-3" style={{ background: pUser.banner }} />
                                            <img src={pUser.avatar} className="h-20 w-20 border-4 border-black object-cover -mt-12 mb-2 bg-white shadow-[3px_3px_0px_0px_#000]" />
                                            <h1 className="text-xl font-black uppercase">{pUser.nickname}</h1>
                                            <p className="font-mono text-xs font-bold text-black/70 mt-1">{pUser.status}</p>
                                        </div>
                                    );
                                })()}
                            </div>
                        )}
                    </main>

                    {/* Модалка создания поста */}
                    {isCreateModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70">
                            <div className="border-4 border-black bg-white p-5 max-w-md w-full shadow-[8px_8px_0px_0px_#000]">
                                <h2 className="text-lg font-black uppercase mb-3 border-b-2 border-black pb-2">Кинуть мем</h2>
                                <form onSubmit={handlePublish} className="space-y-3">
                                    <textarea placeholder="Подпись..." value={newTitle} onChange={e => setNewTitle(e.target.value)} className="w-full border-2 border-black p-2 font-mono text-xs font-bold bg-[#F4F1EA]" required />
                                    <input type="url" placeholder="Ссылка на картинку/GIF (например, Giphy)" value={newMedia} onChange={e => setNewMedia(e.target.value)} className="w-full border-2 border-black p-2 font-mono text-xs font-bold bg-[#F4F1EA]" required />
                                    <div className="flex justify-end gap-2 pt-2">
                                        <button type="button" onClick={() => setIsCreateModalOpen(false)} className="border-2 border-black px-3 py-1.5 font-mono text-xs font-black uppercase bg-white">Отмена</button>
                                        <button type="submit" className="border-2 border-black bg-[#CCFF00] px-4 py-1.5 font-mono text-xs font-black uppercase shadow-[3px_3px_0px_0px_#000]">Опубликовать</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
