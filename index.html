<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>УГАР.IO — Acid Meme Zine</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Inter:wght@700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#F4F1EA] text-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const STORAGE_KEYS = {
            USERS: 'ugario_brutal_users_v3',
            POSTS: 'ugario_brutal_posts_v3'
        };

        const TAGS = ['#все', '#жиза', '#кринж', '#локальный_мем', '#видео'];

        const TAG_COLORS = {
            '#жиза': 'bg-[#CCFF00] text-black',
            '#кринж': 'bg-[#FF2A85] text-white',
            '#локальный_мем': 'bg-[#3B82F6] text-white',
            '#видео': 'bg-[#FFB800] text-black'
        };

        const QUICK_EMOJIS = ['😂', '💀', '🔥', '🤡'];

        const INITIAL_USERS = {
            user_me: {
                id: 'user_me',
                nickname: 'КиберКот_2077',
                status: 'Поставщик отборного кринжа 🌙⚡',
                avatar: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=250&q=80',
                banner: 'linear-gradient(135deg, #CCFF00 0%, #FFB800 100%)',
                joinedDate: 'Сентябрь 2025'
            },
            user_max: {
                id: 'user_max',
                nickname: 'Макс_Бессонница',
                status: 'Сплю 3 часа в сутки ☕💀',
                avatar: 'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=250&q=80',
                banner: 'linear-gradient(135deg, #3B82F6 0%, #CCFF00 100%)',
                joinedDate: 'Октябрь 2025'
            }
        };

        const INITIAL_POSTS = [
            {
                id: 'post_1',
                authorId: 'user_max',
                title: 'Когда открыл ноутбук в 23:55 «просто проверить почту», а на часах уже 04:17 утра...',
                tag: '#жиза',
                mediaUrl: 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbXp1OHB5Y2V0emR5Z2I1NXM3NnY1bHZ6eHh5b3N6Z3B6Z3B6Z3B6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/13HgwGsXF0aiGY/giphy.gif',
                createdAt: '24 МИН. НАЗАД',
                likes: 42,
                dislikes: 1,
                userVote: null,
                emojis: { '😂': 18, '💀': 14 },
                userEmojis: ['💀'],
                comments: [
                    { id: 'c_101', authorId: 'user_me', text: 'Буквально я вчера 😂', createdAt: '19 МИН. НАЗАД' }
                ]
            }
        ];

        function App() {
            const [users, setUsers] = useState(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEYS.USERS);
                    return saved ? JSON.parse(saved) : INITIAL_USERS;
                } catch(e) { return INITIAL_USERS; }
            });

            const [posts, setPosts] = useState(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEYS.POSTS);
                    return saved ? JSON.parse(saved) : INITIAL_POSTS;
                } catch(e) { return INITIAL_POSTS; }
            });

            const [currentUserId] = useState('user_me');
            const [activeView, setActiveView] = useState('feed');
            const [profileTargetId, setProfileTargetId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedTag, setSelectedTag] = useState('#все');
            const [isCreateModalOpen, setIsCreateModalOpen] = useState(false);
            
            // Состояние для создания поста
            const [newTitle, setNewTitle] = useState('');
            const [newTag, setNewTag] = useState('#жиза');
            const [newMedia, setNewMedia] = useState('');

            useEffect(() => {
                localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
            }, [users]);

            useEffect(() => {
                localStorage.setItem(STORAGE_KEYS.POSTS, JSON.stringify(posts));
            }, [posts]);

            const currentUser = users[currentUserId] || INITIAL_USERS.user_me;

            const filteredPosts = useMemo(() => {
                return posts.filter(post => {
                    const author = users[post.authorId];
                    const matchesSearch = !searchQuery || post.title.toLowerCase().includes(searchQuery.toLowerCase()) || (author && author.nickname.toLowerCase().includes(searchQuery.toLowerCase()));
                    const matchesTag = selectedTag === '#все' || post.tag === selectedTag;
                    return matchesSearch && matchesTag;
                });
            }, [posts, users, searchQuery, selectedTag]);

            return (
                <div className="min-h-screen pb-12">
                    {/* Фон с точками */}
                    <div className="fixed inset-0 -z-10 bg-[#F4F1EA]" style={{ backgroundImage: 'radial-gradient(#000000 1.25px, transparent 1.25px)', backgroundSize: '20px 20px' }}>
                        <div className="absolute inset-0 bg-[#F4F1EA]/75" />
                    </div>

                    {/* Шапка */}
                    <header className="sticky top-0 z-40 border-b-2 border-black bg-white">
                        <div className="mx-auto max-w-4xl px-3 py-3 sm:px-6 flex flex-wrap items-center justify-between gap-3">
                            <button onClick={() => setActiveView('feed')} className="flex items-center gap-3 text-left focus:outline-none">
                                <div className="flex h-10 w-10 -rotate-3 items-center justify-center border-2 border-black bg-[#FF2A85] text-white shadow-[3px_3px_0px_0px_#000]">
                                    ⚡
                                </div>
                                <span className="border-2 border-black bg-[#CCFF00] px-2 py-0.5 text-lg font-black tracking-tight text-black uppercase shadow-[2px_2px_0px_0px_#000]">УГАР.IO</span>
                            </button>

                            <div className="flex items-center gap-2">
                                <button onClick={() => setIsCreateModalOpen(true)} className="border-2 border-black bg-[#CCFF00] px-3 py-2 text-xs font-black uppercase shadow-[4px_4px_0px_0px_#000] hover:bg-[#FFB800]">
                                    + КИНУТЬ МЕМ
                                </button>
                                <button onClick={() => { setProfileTargetId(currentUserId); setActiveView('profile'); }} className="flex items-center gap-2 border-2 border-black bg-white p-1 pr-2 shadow-[4px_4px_0px_0px_#000]">
                                    <img src={currentUser.avatar} className="h-7 w-7 border border-black object-cover" />
                                    <span className="font-mono text-xs font-black uppercase">{currentUser.nickname}</span>
                                </button>
                            </div>
                        </div>

                        {activeView === 'feed' && (
                            <div className="mx-auto max-w-4xl px-3 pb-2 flex gap-2 overflow-x-auto no-scrollbar">
                                {TAGS.map(tag => (
                                    <button key={tag} onClick={() => setSelectedTag(tag)} className={`border-2 border-black px-2.5 py-0.5 font-mono text-xs font-black uppercase ${selectedTag === tag ? 'bg-[#FF2A85] text-white shadow-[2px_2px_0px_0px_#000]' : 'bg-[#F4F1EA]'}`}>
                                        {tag}
                                    </button>
                                ))}
                            </div>
                        )}
                    </header>

                    {/* Основной контент */}
                    <main className="mx-auto max-w-xl px-3 py-6">
                        {activeView === 'feed' ? (
                            <div className="space-y-6">
                                {filteredPosts.length === 0 ? (
                                    <div className="border-2 border-black bg-white p-8 text-center font-mono font-bold shadow-[4px_4px_0px_0px_#000]">Мемов не найдено 😢</div>
                                ) : (
                                    filteredPosts.map(post => {
                                        const author = users[post.authorId] || currentUser;
                                        return (
                                            <article key={post.id} className="border-2 border-black bg-white shadow-[6px_6px_0px_0px_#000]">
                                                <div className="flex items-center justify-between border-b-2 border-black bg-[#F4F1EA] px-4 py-3">
                                                    <button onClick={() => { setProfileTargetId(author.id); setActiveView('profile'); }} className="flex items-center gap-3">
                                                        <img src={author.avatar} className="h-10 w-10 border-2 border-black object-cover" />
                                                        <div className="text-left">
                                                            <span className="block font-black uppercase text-sm">{author.nickname}</span>
                                                            <span className="font-mono text-[10px] text-black/60">{post.createdAt}</span>
                                                        </div>
                                                    </button>
                                                    <span className={`border-2 border-black px-2 py-0.5 font-mono text-xs font-black uppercase ${TAG_COLORS[post.tag] || 'bg-[#CCFF00]'}`}>{post.tag}</span>
                                                </div>

                                                <div className="p-4">
                                                    <p className="font-black text-base mb-3">{post.title}</p>
                                                    <div className="border-2 border-black bg-black flex justify-center overflow-hidden">
                                                        <img src={post.mediaUrl} className="max-h-[450px] w-full object-contain" />
                                                    </div>
                                                </div>

                                                <div className="flex items-center justify-between px-4 pb-4">
                                                    <button onClick={() => {
                                                        setPosts(posts.map(p => p.id === post.id ? { ...p, likes: p.userVote === 'like' ? p.likes - 1 : p.likes + 1, userVote: p.userVote === 'like' ? null : 'like' } : p));
                                                    }} className={`border-2 border-black px-3 py-1.5 font-mono text-xs font-black shadow-[3px_3px_0px_0px_#000] ${post.userVote === 'like' ? 'bg-[#FFB800]' : 'bg-white'}`}>
                                                        🔥 Огонь ({post.likes})
                                                    </button>
                                                </div>
                                            </article>
                                        );
                                    })
                                )}
                            </div>
                        ) : (
                            /* Профиль */
                            <div className="border-4 border-black bg-white p-5 shadow-[8px_8px_0px_0px_#000]">
                                <button onClick={() => setActiveView('feed')} className="mb-4 border-2 border-black bg-[#CCFF00] px-3 py-1 font-mono text-xs font-black uppercase shadow-[3px_3px_0px_0px_#000]">
                                    ← Назад к ленте
                                </button>
                                {(() => {
                                    const pUser = users[profileTargetId] || currentUser;
                                    return (
                                        <div>
                                            <div className="h-28 border-2 border-black mb-3" style={{ background: pUser.banner }} />
                                            <img src={pUser.avatar} className="h-20 w-20 border-4 border-black object-cover -mt-12 mb-2 bg-white shadow-[3px_3px_0px_0px_#000]" />
                                            <h1 className="text-xl font-black uppercase">{pUser.nickname}</h1>
                                            <p className="font-mono text-xs font-bold text-black/70 mt-1">{pUser.status}</p>
                                        </div>
                                    );
                                })()}
                            </div>
                        )}
                    </main>

                    {/* Модалка создания поста */}
                    {isCreateModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70">
                            <div className="border-4 border-black bg-white p-5 max-w-md w-full shadow-[8px_8px_0px_0px_#000]">
                                <h2 className="text-lg font-black uppercase mb-3 border-b-2 border-black pb-2">Кинуть мем</h2>
                                <div className="space-y-3">
                                    <textarea placeholder="Подпись..." value={newTitle} onChange={e => setNewTitle(e.target.value)} className="w-full border-2 border-black p-2 font-mono text-xs font-bold bg-[#F4F1EA]" />
                                    <input type="text" placeholder="Ссылка на картинку/GIF" value={newMedia} onChange={e => setNewMedia(e.target.value)} className="w-full border-2 border-black p-2 font-mono text-xs font-bold bg-[#F4F1EA]" />
                                    <div className="flex justify-end gap-2 pt-2">
                                        <button onClick={() => setIsCreateModalOpen(false)} className="border-2 border-black px-3 py-1.5 font-mono text-xs font-black uppercase bg-white">Отмена</button>
                                        <button onClick={() => {
                                            if(!newTitle || !newMedia) return;
                                            const newPost = {
                                                id: 'p_' + Date.now(),
                                                authorId: currentUserId,
                                                title: newTitle,
                                                tag: newTag,
                                                mediaUrl: newMedia,
                                                createdAt: 'Только что',
                                                likes: 1,
                                                dislikes: 0,
                                                userVote: 'like',
                                                emojis: {},
                                                userEmojis: [],
                                                comments: []
                                            };
                                            setPosts([newPost, ...posts]);
                                            setNewTitle('');
                                            setNewMedia('');
                                            setIsCreateModalOpen(false);
                                        }} className="border-2 border-black bg-[#CCFF00] px-4 py-1.5 font-mono text-xs font-black uppercase shadow-[3px_3px_0px_0px_#000]">Опубликовать</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
